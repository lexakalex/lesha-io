name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build marker
        run: |
          sed -i "s|__BUILD_ID__|${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%M:%SZ)|" index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 498b619a52c12cd8efba068e2655b90c
          command: pages deploy . --project-name=lesha-io --branch=main
